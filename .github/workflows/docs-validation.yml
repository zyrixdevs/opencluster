name: Documentation validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Validate documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the link checker
        run: python -m unittest discover -s tests -v
      - name: Check relative Markdown links
        run: python scripts/check_docs.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard
      - name: Typecheck dashboard
        run: npm --prefix dashboard run typecheck
      - name: Lint dashboard
        run: npm --prefix dashboard run lint
      - name: Test dashboard
        run: npm --prefix dashboard test
      - name: Build dashboard
        run: npm --prefix dashboard run build
